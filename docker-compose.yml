# NOVA GPU box. Deploy in Portainer: Stacks -> Add stack -> Repository
#   URL: https://github.com/Sawman24/NOVA_GPU   Compose path: docker-compose.yml
#   Environment variables: at least NOVA_TOKEN (see .env.example)
# Needs the NVIDIA Container Toolkit on the host (scripts/check_gpu.sh tests it).
name: nova

services:
  ollama:
    image: ollama/ollama:latest
    container_name: nova-ollama
    restart: unless-stopped
    environment:
      OLLAMA_KEEP_ALIVE: "-1"                  # keep models loaded (fast replies)
      OLLAMA_NUM_PARALLEL: "1"                 # one request at a time: all VRAM for context
      OLLAMA_SCHED_SPREAD: ${OLLAMA_SCHED_SPREAD:-0}   # 1 = spread the model over both V100s
    volumes:
      - ${OLLAMA_DIR:-ollama-models}:/root/.ollama
    # Not published: only the Gateway talks to Ollama. To reach it from your LAN, uncomment:
    # ports: ["11434:11434"]
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  searxng:                                     # private web search (Google, Bing, DuckDuckGo... combined)
    build: ./searxng
    image: nova-searxng:latest
    container_name: nova-searxng
    restart: unless-stopped
    environment:
      SEARXNG_BASE_URL: http://searxng:8080/
    # Not published: only the Gateway uses it. To try it in a browser, uncomment:
    # ports: ["8888:8080"]

  gateway:
    build:
      context: .
      args:
        VOICE_ID: ${VOICE_ID:-1}
    image: nova-gateway:latest
    container_name: nova-gateway
    restart: unless-stopped
    depends_on: [ollama, searxng]
    ports:
      - "${NOVA_PORT:-8800}:8800"
    environment:
      NOVA_TOKEN: ${NOVA_TOKEN:-}              # must equal core.gateway_token on the Core PC
      OLLAMA_URL: http://ollama:11434
      SEARXNG_URL: http://searxng:8080
      BRAIN_MODEL: ${BRAIN_MODEL:-bonsai-2:27b}
      REFLEX_MODEL: ${REFLEX_MODEL:-bonsai-2:4b}
      EMBED_MODEL: ${EMBED_MODEL:-nomic-embed-text}
      BRAIN_CONTEXT: ${BRAIN_CONTEXT:-24576}
      REFLEX_CONTEXT: ${REFLEX_CONTEXT:-8192}
      REFLEX_UNLOAD_AFTER: ${REFLEX_UNLOAD_AFTER:-30}   # seconds idle before the small model leaves the GPU (0 = keep loaded)
      WHISPER_MODEL: ${WHISPER_MODEL:-small.en}
      WHISPER_DEVICE: ${WHISPER_DEVICE:-auto}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      XAI_API_KEY: ${XAI_API_KEY:-}
      TZ: ${TZ:-America/Phoenix}
    volumes:
      - ${NOVA_DATA:-nova-data}:/data          # memory, chats, voice prints, model caches
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

volumes:
  ollama-models:
  nova-data:
